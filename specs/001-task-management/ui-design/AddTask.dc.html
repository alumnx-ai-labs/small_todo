<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
:root{
  --bg: oklch(98% 0.004 275);
  --surface: oklch(100% 0 0);
  --border: oklch(91% 0.012 275);
  --text: oklch(22% 0.02 275);
  --text-soft: oklch(50% 0.016 275);
  --text-faint: oklch(64% 0.012 275);
  --accent: oklch(55% 0.19 290);
  --accent-hover: oklch(47% 0.19 290);
  --accent-soft: oklch(94% 0.035 290);
  --todo: oklch(55% 0.01 275);
  --todo-soft: oklch(95% 0.006 275);
  --progress: oklch(62% 0.15 65);
  --done: oklch(60% 0.14 150);
  --blocked-soft: oklch(95% 0.05 25);
  --blocked: oklch(56% 0.2 25);
}
body{ margin:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Sans','Segoe UI',sans-serif; }
h1,h2,h3,.heading{ font-family:'Space Grotesk','Segoe UI',sans-serif; letter-spacing:-0.01em; margin:0; }
.btn-primary{ transition:background .15s ease; } .btn-primary:hover{ background:var(--accent-hover); }
.btn-ghost{ transition:background .15s ease; } .btn-ghost:hover{ background:var(--todo-soft); }
</style>
</helmet>

<div style="width:1440px;height:900px;position:relative;box-sizing:border-box;overflow:hidden;background:var(--bg);">

  <div style="position:absolute;inset:0;display:flex;filter:blur(1.5px);opacity:0.55;">
    <div style="width:232px;flex:0 0 232px;background:var(--surface);border-right:1px solid var(--border);"></div>
    <div style="flex:1;padding:36px 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:26px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;flex-direction:column;gap:4px;">
          <h1 style="font-size:22px;font-weight:700;">Your board</h1>
          <span style="font-size:13px;color:var(--text-soft);">Tasks assigned to Priya</span>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;">
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;height:70px;"></div>
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;height:70px;"></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;height:70px;"></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;height:70px;"></div>
        </div>
      </div>
    </div>
  </div>

  <div style="position:absolute;inset:0;background:oklch(20% 0.02 275 / 0.35);display:flex;align-items:center;justify-content:center;">
    <div style="width:460px;background:var(--surface);border-radius:18px;padding:28px;box-sizing:border-box;box-shadow:0 24px 48px oklch(20% 0.02 275 / 0.22);display:flex;flex-direction:column;gap:22px;">

      <div style="display:flex;align-items:center;justify-content:space-between;">
        <h2 style="font-size:18px;font-weight:700;">New task</h2>
        <div style="width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-faint);cursor:pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;">
        <label style="font-size:13px;font-weight:600;">Title</label>
        <div style="border:1.5px solid var(--accent);border-radius:9px;padding:10px 13px;font-size:14.5px;box-shadow:0 0 0 3px var(--accent-soft);">Prep demo script for Friday review</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;">
        <label style="font-size:13px;font-weight:600;">Description <span style="font-weight:400;color:var(--text-faint);">(optional)</span></label>
        <div style="border:1px solid var(--border);border-radius:9px;padding:10px 13px;font-size:14px;color:var(--text-faint);height:64px;">Add more detail so teammates know the context…</div>
      </div>

      <span style="font-size:12px;color:var(--text-faint);">New tasks start in Todo and are assigned to you.</span>

      <div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;">
        <div class="btn-ghost" style="padding:10px 16px;border-radius:9px;border:1px solid var(--border);font-size:13.5px;font-weight:600;color:var(--text-soft);cursor:pointer;">Cancel</div>
        <div class="btn-primary" style="padding:10px 18px;border-radius:9px;background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;">Create task</div>
      </div>

    </div>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
